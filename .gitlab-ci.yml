# CI unica-ops (janitor): build образа → CVE-скан (trivy) → push в GitLab Container Registry.
# СТАРТОВЫЙ ШАБЛОН по образцу rospartner.ai.unica.workflow: DevOps должен подтвердить теги
# раннеров (tags) и доступность registry. CVE-скан обязателен (продукт идёт в open-source).
#
# CI «спящий» до готовности DevOps: пайплайн запускается ТОЛЬКО когда в проекте задана
# CI/CD-переменная OPS_CI_ENABLED=true (Settings → CI/CD → Variables). Первый push
# в репозиторий НЕ создаёт «красный» пайплайн на ненастроенном раннере/registry.
#
# TODO: кода и Dockerfile в репозитории ещё нет — janitor переносится из монорепы после
# развязки доменного долга (см. README.md, волна J2.3). До переноса janitor собирается
# монорепным Dockerfile (target janitor-runtime, образ unica/unica-janitor).
workflow:
  rules:
    - if: '$OPS_CI_ENABLED == "true"'

stages: [build, scan, push]

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  tags: [unica-dev]            # TODO(DevOps): уточнить тег раннера со встроенным docker
  script:
    - docker build -t "$IMAGE:$TAG" .
    - docker save "$IMAGE:$TAG" -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 hour

trivy_scan:
  stage: scan
  tags: [unica-dev]
  needs: [build]
  script:
    - docker load -i image.tar
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest
        image --severity HIGH,CRITICAL --no-progress "$IMAGE:$TAG"
  allow_failure: true

push:
  stage: push
  tags: [unica-dev]
  needs: [build, trivy_scan]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "master"'
  script:
    - docker load -i image.tar
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push "$IMAGE:$TAG"
    - docker tag "$IMAGE:$TAG" "$IMAGE:$CI_COMMIT_BRANCH"
    - docker push "$IMAGE:$CI_COMMIT_BRANCH"

